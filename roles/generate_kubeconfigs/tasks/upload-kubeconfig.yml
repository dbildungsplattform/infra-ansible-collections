---
- name: Check if there are kubeconfigs to upload
  ansible.builtin.find:
    paths: "/tmp/{{ _user }}"
    patterns: "*.yaml"
  register: _kubeconfig_files

- name: "No kubeconfigs to upload for {{ _user }}"
  ansible.builtin.debug:
    msg: "The folder doesn't contain any kubeconfigs"
  when: _kubeconfig_files.matched == 0

- name: "Create archive and check if hash changed for {{ _user }}"
  when: _kubeconfig_files.matched > 0
  block:
    # The archive contains the access and modification times so this is needed to make it produce consistent hashes
    - name: Set access and modification times for Kubeconfigs
      ansible.builtin.file:
        path: "/tmp/{{ _user }}"
        access_time: 202301010000.00
        modification_time: 202301010000.00
        recurse: true

    - name: Archive Kubeconfigs
      community.general.archive:
        path: "/tmp/{{ _user }}/*"
        dest: "/tmp/{{ _user }}.zip"
        format: zip
        mode: "0600"

    - name: Compute Kubeconfig archive hash
      ansible.builtin.stat:
        path: "/tmp/{{ _user }}.zip"
        checksum_algorithm: sha256
      register: _stat
      when: _personal

    - name: Upload hash to 1Password
      dbildungscloud.onepwd.item:
        vault: "{{ generate_kubeconfigs_kubeconfigs_vault }}"
        service_account_token: "{{ generate_kubeconfigs_op_service_account_token }}"
        name: "{{ _user }}-kubeconfigs.sha256"
        category: Secure Note
        fields:
          - name: notesPlain
            type: text
            value: "{{ _stat.stat.checksum }}"
        session_shorthand: ansible-run
      register: _upload_hash
      when: _personal

- name: "Perform encrypted upload for {{ _user }}"
  when: _kubeconfig_files.matched > 0 and _personal and _upload_hash.changed
  block:
    - name: Convert SSH public key to pem format
      ansible.builtin.command:
        cmd: "ssh-keygen -f {{ generate_kubeconfigs_sshkeys_dir }}/{{ _user }}.pub -e -m PKCS8"
      register: _pem_key
      changed_when: false

    - name: Create pem public key file
      ansible.builtin.copy:
        content: "{{ _pem_key.stdout }}"
        dest: "/tmp/{{ _user }}.pem"
        mode: "0600"
      changed_when: false

    - name: Generate AES password
      changed_when: false
      ansible.builtin.command:
        cmd: "openssl rand -base64 -out /tmp/{{ _user }}.pass 128"

    - name: Encrypt AES password
      changed_when: false
      ansible.builtin.command:
        cmd: "openssl pkeyutl -encrypt -pubin -inkey /tmp/{{ _user }}.pem -in /tmp/{{ _user }}.pass -out /tmp/{{ _user }}.pass.enc"

    - name: Encrypt Kubeconfig archive
      changed_when: false
      ansible.builtin.command:
        cmd: "openssl enc -aes-256-cbc -pbkdf2 -kfile /tmp/{{ _user }}.pass -in /tmp/{{ _user }}.zip -out /tmp/{{ _user }}.zip.enc"

    - name: Upload encrypted AES password to 1Password
      dbildungscloud.onepwd.document:
        vault: "{{ generate_kubeconfigs_kubeconfigs_vault }}"
        service_account_token: "{{ generate_kubeconfigs_op_service_account_token }}"
        name: "{{ _user }}-kubeconfigs.pass"
        path: "/tmp/{{ _user }}.pass.enc"
        session_shorthand: ansible-run

    - name: Upload encrypted Kubeconfig archive to 1Password
      dbildungscloud.onepwd.document:
        vault: "{{ generate_kubeconfigs_kubeconfigs_vault }}"
        service_account_token: "{{ generate_kubeconfigs_op_service_account_token }}"
        name: "{{ _user }}-kubeconfigs"
        path: "/tmp/{{ _user }}.zip.enc"
        session_shorthand: ansible-run

- name: "Perform unencrypted upload for {{ _user }}"
  when: _kubeconfig_files.matched > 0 and not _personal
  dbildungscloud.onepwd.document:
    vault: "{{ generate_kubeconfigs_infra_vault }}"
    service_account_token: "{{ generate_kubeconfigs_op_service_account_token }}"
    name: "{{ _user }}-kubeconfigs"
    path: "/tmp/{{ _user }}.zip"
    session_shorthand: ansible-run
