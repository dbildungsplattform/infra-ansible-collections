---
- name: Validate the role inputs
  ansible.builtin.include_tasks:
    file: asserts.yml
    apply:
      tags: always
  tags: always

- name: Check rollout scope (local guard, single stage, single project)
  ansible.builtin.include_tasks:
    file: scope_checks.yml
    apply:
      tags: always
  when: before_rollout_checks_scope_enabled | bool
  tags: always

- name: Verify that the project revision is not behind the remote branch
  ansible.builtin.include_tasks:
    file: stale_branch.yml
    apply:
      tags: always
  when: before_rollout_checks_stale_enabled | bool
  tags: always

- name: Check (and optionally acquire) the rollout lock
  when: before_rollout_checks_lock_enabled | bool
  tags: always
  block:
    - name: Check the rollout lock
      ansible.builtin.include_tasks:
        file: lock_check.yml
        apply:
          tags: always
      tags: always

    - name: Acquire the rollout lock
      ansible.builtin.include_tasks:
        file: lock_acquire.yml
        apply:
          tags: always
      when: before_rollout_checks_lock_acquire | bool
      tags: always
